name: Bug report
description: Report a reproducible problem with the timeline widget.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest event data and configuration that reproduce the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: timelxne version, OS, Java version, and Eclipse/SWT version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
