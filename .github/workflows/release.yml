name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build release artifacts
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Prepare named release assets
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          p2_archives=(releng/dev.timelxne.timeline.repository/target/dev.timelxne.timeline.repository-*.zip)
          test "${#p2_archives[@]}" -eq 1
          mkdir release-assets
          cp "${p2_archives[0]}" "release-assets/timelxne-p2-${release_version}.zip"
          cp releng/dev.timelxne.timeline.repository/target/products/dev.timelxne.timeline.demo.product-linux.gtk.x86_64.tar.gz "release-assets/timelxne-demo-${release_version}-linux-gtk-x86_64.tar.gz"
          cp releng/dev.timelxne.timeline.repository/target/products/dev.timelxne.timeline.demo.product-win32.win32.x86_64.zip "release-assets/timelxne-demo-${release_version}-windows-x86_64.zip"
          cp releng/dev.timelxne.timeline.repository/target/products/dev.timelxne.timeline.demo.product-macosx.cocoa.x86_64.tar.gz "release-assets/timelxne-demo-${release_version}-macos-x86_64.tar.gz"
          cp releng/dev.timelxne.timeline.repository/target/products/dev.timelxne.timeline.demo.product-macosx.cocoa.aarch64.tar.gz "release-assets/timelxne-demo-${release_version}-macos-aarch64.tar.gz"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "timelxne ${GITHUB_REF_NAME}"
