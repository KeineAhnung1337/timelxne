name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify reactor
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timelxne-build-${{ github.sha }}
          if-no-files-found: warn
          path: |
            releng/dev.timelxne.timeline.repository/target/*.zip
            releng/dev.timelxne.timeline.repository/target/products/*.tar.gz
            releng/dev.timelxne.timeline.repository/target/products/*.zip
            tests/dev.timelxne.timeline.tests/target/surefire-reports/
